<body class="bg-surface-container-low min-h-screen flex flex-col font-body text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas -->

<!-- Full Bleed Hero -->

<!-- Background Image -->

<!-- Soft Dark Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface via-inverse-surface/40 to-transparent opacity-95"></div>
<!-- Text Overlay content -->
<div class="absolute bottom-0 left-0 w-full p-6 pb-20 flex flex-col">
<span class="font-label text-[11px] uppercase tracking-[0.15em] text-secondary-container font-semibold mb-3">
                    DESDE 1971 · MATAGALPA &amp; JINOTEGA
                </span>
<h1 class="font-headline text-4xl text-on-primary leading-tight mb-4">
                    Tres generaciones.<br/>Una taza.
                </h1>
<p class="font-body text-sm text-surface-container-low font-light leading-relaxed max-w-[280px]">
                    El café de nuestra finca, ahora en tu bolsillo: sellos, monedero, cosechas y experiencias de la casa.
                </p>
</div>
</div>
<!-- Overlapping Card & Actions Section -->
<div class="relative z-10 flex-grow flex flex-col items-center px-4 pb-8 -mt-10">
<!-- Main Action Card -->
<div class="w-full bg-surface-container-lowest rounded-2xl shadow-xl p-6 border border-surface-container-highest">
<label class="font-label text-[11px] uppercase tracking-[0.1em] text-on-surface-variant font-medium block mb-2" for="whatsapp">
                    TU NÚMERO DE WHATSAPP
                </label>
<!-- Input Group -->
<div class="flex items-center rounded-xl border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary overflow-hidden mb-6 transition-all bg-surface-container-lowest">
<div class="bg-surface-container-low px-4 py-3 border-r border-outline-variant flex items-center justify-center">
<span class="font-body text-base text-on-surface font-medium">+505</span>
</div>
<input class="flex-grow bg-transparent px-4 py-3 border-none focus:outline-none focus:ring-0 font-body text-base text-on-surface placeholder-outline font-medium w-full" id="whatsapp" placeholder="0000 0000" type="tel"/>
</div>
<!-- Primary Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label text-[13px] uppercase tracking-widest font-semibold py-4 rounded-full flex items-center justify-center hover:bg-primary transition-colors hover:text-on-primary active:scale-[0.98] duration-200 mb-5">
                    Unite al Club
                </button>
<!-- Reassurance Row -->
<div class="flex items-start gap-3 pt-1 border-t border-surface-variant">
<span class="material-symbols-outlined text-secondary-container text-xl" style="font-variation-settings: 'FILL' 1;">redeem</span>
<p class="font-body text-xs text-on-surface-variant leading-tight pt-0.5">
<strong class="font-semibold text-on-surface">De bienvenida:</strong> 2 sellos de regalo y una sorpresa de cumpleaños.
                    </p>
</div>
</div>
<!-- Secondary Link -->
<button class="mt-8 flex items-center justify-center gap-1 font-label text-[11px] uppercase tracking-widest text-primary font-semibold hover:text-primary-container transition-colors group">
<span>Ya soy socio — Iniciar sesión</span>
<span class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Footer Terms -->
<div class="mt-auto pt-8 w-full text-center">
<p class="font-body text-[10px] text-outline">
                    Al continuar aceptás los términos del Club Lupita
                </p>
</div>
